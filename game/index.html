<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a heist in four rooms</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17141f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* The live status line: announced to screen readers, invisible on screen. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="The Gilded Vault: rob four rooms and reach the getaway van. Move with WASD or the arrow keys, toss a coin with Q, drop smoke with F."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
